name: Publish Staxa image to GHCR (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: staxa-ghcr-${{ github.sha }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Validate deployment and shared security runtime
        run: |
          python3 deploy/staxa/generate_dockerfile.py --check
          python3 deploy/staxa/test_deployment.py
      - name: Determine commit-specific image reference
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          image="ghcr.io/${REPOSITORY,,}/odoo-staxa:sha-${COMMIT_SHA}"
          echo "ref=$image" >> "$GITHUB_OUTPUT"
      - name: Build from repository root without registry credentials
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          docker build --file deploy/staxa/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/$REPOSITORY" \
            --label "org.opencontainers.image.revision=$COMMIT_SHA" \
            --tag "$IMAGE" .
      - name: Authenticate to GHCR
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/staxa-docker-auth
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        run: |
          mkdir -p "$DOCKER_CONFIG"
          chmod 700 "$DOCKER_CONFIG"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_ACTOR" --password-stdin
      - name: Publish and verify registry manifest
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/staxa-docker-auth
          IMAGE: ${{ steps.image.outputs.ref }}
        run: |
          docker push "$IMAGE"
          docker manifest inspect "$IMAGE" > "$RUNNER_TEMP/staxa-ghcr-manifest.json"
          printf 'Published and registry-verified image: `%s`\n' "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove registry credentials
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/staxa-docker-auth
        if: always()
        run: rm -rf -- "$DOCKER_CONFIG"
