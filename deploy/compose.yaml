services:
  db:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE to a pinned PostgreSQL 16 image}
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set the PostgreSQL administrator password}
      ODOO_DB_PASSWORD: ${ODOO_DB_PASSWORD:?Set the application database password}
    volumes:
      - db:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d field_crm"]
      interval: 5s
      timeout: 3s
      retries: 30

  odoo:
    image: ${ODOO_IMAGE:?Set ODOO_IMAGE to a pinned Odoo 18 image}
    restart: unless-stopped
    env_file: delivery.env
    environment:
      HOST: db
      USER: odoo
      PASSWORD: ${ODOO_DB_PASSWORD:?Set the application database password}
    volumes:
      - odoo:/var/lib/odoo
      - ./odoo.conf:/etc/odoo/odoo.conf:ro
      - ../addons:/mnt/extra-addons:ro
    networks: [edge, database]
    depends_on:
      db:
        condition: service_healthy

  proxy:
    image: ${CADDY_IMAGE:?Set CADDY_IMAGE to a pinned Caddy 2 image}
    restart: unless-stopped
    environment:
      CRM_DOMAIN: ${CRM_DOMAIN:?Set the CRM domain}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
      - caddy-config:/config
    networks: [edge]
    depends_on: [odoo]

networks:
  edge:
  database:
    internal: true

volumes:
  db:
  odoo:
  caddy:
  caddy-config:
